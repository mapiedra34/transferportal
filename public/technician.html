<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Portal | Technician</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo">TP</div>
        <div>
          <div class="title">Transfer Portal</div>
          <div class="subtitle">Technician request</div>
        </div>
      </div>
      <div class="mode-switch">
        <a class="ghost sign-out" href="index.html">Sign out</a>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-header">
          <div>
            <p id="greeting" class="eyebrow"></p>
            <h1>Submit a transfer request</h1>
          </div>
          <div class="hint">Use your work email so managers can reach you.</div>
        </div>

        <form id="requestForm" class="form">
          <label class="field">
            <span>Work email</span>
            <input type="email" id="email" name="email" placeholder="you@microsoft.com" required>
          </label>

          <label class="field">
            <span>Current site</span>
            <select id="currentSite" name="currentSite" required></select>
          </label>

          <label class="field">
            <span>Preferred site</span>
            <select id="preferredSite" name="preferredSite" required></select>
          </label>

          <label class="field">
            <span>Preferred shift</span>
            <select id="preferredShift" name="preferredShift" required></select>
          </label>

          <label class="field">
            <span>Notes (optional)</span>
            <textarea id="notes" name="notes" rows="3" placeholder="Any context that helps your manager review"></textarea>
          </label>

          <div class="actions">
            <button type="submit" class="primary">Submit request</button>
            <div class="fine-print">Requests are time-stamped and visible to managers.</div>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="./js/shared.js"></script>
  <script src="./js/technician.js"></script>
</body>
</html>
