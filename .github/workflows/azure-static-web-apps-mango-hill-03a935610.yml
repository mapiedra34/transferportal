name: Bun CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  bun_ci:
    runs-on: ubuntu-latest
    name: Install and Verify

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start server smoke test
        env:
          PORT: 3000
        run: |
          set -euo pipefail

          bun run start > /tmp/transfer-portal.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
            fi
          }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl -fsS "http://localhost:${PORT}/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Server failed smoke test. Startup logs:"
          cat /tmp/transfer-portal.log
          exit 1
